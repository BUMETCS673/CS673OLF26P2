services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadence}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      # Correct for postgres:18 — the data lives at /var/lib/postgresql, not .../data.
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cadence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9
    container_name: valkey
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      # The Dockerfile's last stage is `prod` (non-root). Local development
      # wants the reloader, so ask for `dev` explicitly.
      target: dev
    container_name: backend
    restart: unless-stopped
    environment: &backend-env
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/cadence}
      REDIS_URL: ${REDIS_URL:-redis://valkey:6379/0}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      TOKEN_HASH_KEY: ${TOKEN_HASH_KEY:-dev-only-token-hash-key}  # refused over HTTPS
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Metrics and logs over OTLP, off unless .env sets an endpoint.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment.name=local}
      # The stand-in models unless .env names a vendor and has its key.
      AI_WRITER_PROVIDER: ${AI_WRITER_PROVIDER:-fake}
      AI_WRITER_MODEL: ${AI_WRITER_MODEL:-}
      # Follows the writer, so setting only the writer can't leave a fake judge approving cards.
      AI_JUDGE_PROVIDER: ${AI_JUDGE_PROVIDER:-${AI_WRITER_PROVIDER:-fake}}
      AI_HELPER_PROVIDER: ${AI_HELPER_PROVIDER:-${AI_WRITER_PROVIDER:-fake}}
      AI_HELPER_MODEL: ${AI_HELPER_MODEL:-}
      AI_WRITER_FALLBACKS: ${AI_WRITER_FALLBACKS:-}
      AI_JUDGE_FALLBACKS: ${AI_JUDGE_FALLBACKS:-}
      AI_HELPER_FALLBACKS: ${AI_HELPER_FALLBACKS:-}
      AI_EMBEDDER_PROVIDER: ${AI_EMBEDDER_PROVIDER:-${AI_WRITER_PROVIDER:-fake}}
      AI_EMBEDDER_MODEL: ${AI_EMBEDDER_MODEL:-}
      AI_WRITER_THINKING: ${AI_WRITER_THINKING:-}
      AI_JUDGE_THINKING: ${AI_JUDGE_THINKING:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-cadence}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-10}
      AI_MODEL_DAILY_LIMIT: ${AI_MODEL_DAILY_LIMIT:-18}
      AI_MODEL_DAILY_LIMITS: ${AI_MODEL_DAILY_LIMITS:-}
      AI_TUTOR_ENABLED: ${AI_TUTOR_ENABLED:-true}
      AI_TUTOR_DAILY_LIMIT: ${AI_TUTOR_DAILY_LIMIT:-100}
      AI_TUTOR_USER_DAILY_LIMIT: ${AI_TUTOR_USER_DAILY_LIMIT:-20}
      AI_LEECH_ENABLED: ${AI_LEECH_ENABLED:-true}
      AI_LEECH_DAILY_LIMIT: ${AI_LEECH_DAILY_LIMIT:-10}
      AI_LEECH_USER_DAILY_LIMIT: ${AI_LEECH_USER_DAILY_LIMIT:-4}
      AI_LEECH_MODEL_RESERVE: ${AI_LEECH_MODEL_RESERVE:-9}
      AI_JUDGE_MODEL: ${AI_JUDGE_MODEL:-}
    volumes:
      - ./backend:/app
    ports:
      - "5001:5000"
    depends_on:
      postgres:
        # Wait until each one actually answers, not just until the container starts.
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: dev
    container_name: worker
    restart: unless-stopped
    command: taskiq worker app.jobs.broker:broker app.jobs.tasks --workers 1 --max-async-tasks 20 --reload
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        # Wait until each one actually answers, not just until the container starts.
        condition: service_healthy
      valkey:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # `prod` is nginx serving a build; dev wants Vite and hot reload.
      target: dev
    container_name: react-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
