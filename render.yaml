# Render Blueprint. Setup steps in doc/CICD.md.

databases:
  - name: cadence-db
    databaseName: cadence
    user: cadence
    plan: free
    # Keep in sync with docker-compose.yml and ci.yml's postgres service.
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: cadence-backend
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./code/backend/Dockerfile
    dockerContext: ./code/backend
    autoDeploy: false
    healthCheckPath: /api/health
    dockerCommand: sh -c "flask db upgrade && exec gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --access-logfile - wsgi:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cadence-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: PORT
        value: "5000"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false

  - type: web
    name: cadence-frontend
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./code/frontend/Dockerfile
    dockerContext: ./code/frontend
    autoDeploy: false
    envVars:
      - key: PORT
        value: "8080"
      # The backend's public URL, no trailing slash.
      - key: API_ORIGIN
        sync: false
