# Render Blueprint -- the deploy target's infrastructure, in the repo rather than in a
# dashboard nobody can review. Create it once at
# https://dashboard.render.com/select-repo?type=blueprint, then CD's deploy hooks take
# over. Full walkthrough in doc/CICD.md.
#
# Everything here is on Render's free tier. Free web services sleep after 15 minutes
# idle, so the first request to a cold deployment takes ~30 seconds -- expected, not a
# bug, and the reason CD's health poll allows 10 minutes.

databases:
  - name: cadence-db
    databaseName: cadence
    user: cadence
    plan: free
    # Same region as both web services: Render's internal hostnames only resolve within
    # one region, and an unset region defaults to Oregon.
    region: ohio
    # Keep this equal to the version in docker-compose.yml and in ci.yml's postgres
    # service. Testing on one major and deploying on another reintroduces exactly the
    # gap the sqlite/postgres test matrix was added to close. If Render doesn't offer 18
    # yet, lower all three together rather than letting them drift.
    postgresMajorVersion: "18"
    # Only the backend service may connect; nothing from the public internet.
    ipAllowList: []

services:
  # Redis-compatible, for the task queue, live events and caches. The free plan doesn't save to
  # disk, which is fine: Postgres holds the truth, and the outbox relay re-sends lost tasks.
  - type: keyvalue
    name: cadence-valkey
    plan: free
    region: ohio
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: cadence-backend
    runtime: docker
    plan: free
    region: ohio
    # The Dockerfile's last stage is `prod` (non-root), which is what Render
    # builds. That is the same stage CI builds and CD pushes to GHCR.
    dockerfilePath: ./code/backend/Dockerfile
    dockerContext: ./code/backend
    # CD posts to the deploy hook with an explicit commit, so Render should not also
    # deploy on its own every push.
    autoDeploy: false
    healthCheckPath: /api/health
    # Migrations run as the backend starts: the prod stage's CMD in the Dockerfile runs
    # `alembic upgrade head` first, in scripts/start.sh, which also starts the worker in the same
    # container, since background workers aren't on the free plan. Safe only with one instance.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cadence-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cadence-valkey
          property: connectionString
      # Render terminates TLS, so the session cookie can and must be Secure here.
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: PORT
        value: "5000"
      # The real models. Each chat role falls back to other Gemini models once a model's daily
      # limit is reached. Set AI_WRITER_PROVIDER to "fake" in the dashboard for sample cards.
      - key: AI_WRITER_PROVIDER
        value: gemini
      - key: AI_JUDGE_PROVIDER
        value: gemini
      - key: AI_HELPER_PROVIDER
        value: gemini
      - key: AI_EMBEDDER_PROVIDER
        value: gemini
      # sync: false means Render never fills these in from this file: enter them by hand
      # in the backend's Environment tab. The keys are secrets; they never go in the repo.
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_WRITER_MODEL
        sync: false
      - key: AI_JUDGE_MODEL
        sync: false

  - type: web
    name: cadence-frontend
    runtime: docker
    plan: free
    region: ohio
    # Last stage is `prod`: nginx serving the Vite build.
    dockerfilePath: ./code/frontend/Dockerfile
    dockerContext: ./code/frontend
    autoDeploy: false
    envVars:
      - key: PORT
        value: "8080"
      # Where nginx forwards /api, set once when the blueprint is created: the backend's
      # public address, https://cadence-backend-....onrender.com, from its service page.
      # Not the internal http://cadence-backend:5000: free web services can send
      # private-network traffic but can't receive it (render.com/docs/private-network).
      # Keeping the browser on one origin is what makes the session cookie work without
      # CORS (decision D4).
      - key: API_ORIGIN
        sync: false
