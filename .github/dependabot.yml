version: 2

# Weekly, grouped, and capped. The point is that a dependency with a published
# vulnerability doesn't sit unnoticed for a whole semester -- not to generate a PR for
# every patch release, which nobody would review.
#
# Major version bumps are ignored for pip and npm: they need reading and testing, and
# nobody should be upgrading frameworks mid-semester by accident. Security fixes still
# come through, because Dependabot security updates are enabled on the repo and the
# version-update:semver-major rule doesn't hold them back.
updates:
  - package-ecosystem: pip
    directory: /code/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      # One PR for the whole set of patch/minor bumps.
      backend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /code/frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # Actions get pinned to major tags (actions/checkout@v4), so this mostly catches the
  # v4 -> v5 moves that would otherwise go stale. Majors are kept here (CI exercises every
# action on the PR itself) but grouped, so it's one PR a week instead of one per action.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
