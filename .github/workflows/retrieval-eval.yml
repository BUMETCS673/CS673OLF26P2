# Measures search quality with the real embedding model. It spends real calls, so it only runs when
# search code or its cases change, and on request.
name: Retrieval evaluation

on:
  pull_request:
    paths:
      - code/backend/app/ai/knowledge/**
      - code/backend/app/repositories/knowledge.py
      - code/backend/evals/retrieval*.py
      - .github/workflows/retrieval-eval.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval:
    # A fork's pull request doesn't get this repository's secrets.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: evals  # holds the keys, so each run waits for its reviewer
    defaults:
      run:
        working-directory: code/backend

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: cadence_eval
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cadence_eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cadence_eval

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: alembic upgrade head

      - name: Run the evaluation
        # Report only on pull requests, as the red-team run does.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          # Shares the red-team key, because the app's budgets don't see these calls either.
          GEMINI_API_KEY: ${{ secrets.REDTEAM_GEMINI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: cadence-retrieval
        run: python -m evals.retrieval
