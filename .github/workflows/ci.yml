name: CI

# Nobody on the team runs the stack before pushing, so this is where "does it actually
# build and pass" gets answered. Both jobs run on every push and every pull request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/backend/requirements.txt

      - run: pip install -r requirements.txt

      # TestConfig points at in-memory SQLite, so there's no database service to start.
      # Coverage flags live in pyproject.toml, so this is the same command everyone
      # runs locally. Reporting only for now: to enforce the SPPP's 70% target, add
      # --cov-fail-under=70 there and the build starts failing below it.
      - run: python -m pytest -q

  lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/backend/requirements.txt

      - run: pip install -r requirements.txt

      # PEP 8 plus unused imports, import order, and a handful of likely-bug checks.
      # Config and the reasoning behind the rule selection are in pyproject.toml.
      # Separate from the test job so a style failure doesn't report as "Backend
      # tests failed" -- and so it can be required on its own in the branch ruleset.
      - run: ruff check .

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json

      # Same command the Dockerfile runs, so a lockfile that's out of step with
      # package.json fails here rather than the next time someone builds the image.
      - run: npm ci

      # Vite type-checks nothing, but it does parse and bundle every module, so a bad
      # import path or broken JSX fails here.
      - run: npm run build
