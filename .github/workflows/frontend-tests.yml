name: Frontend tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Frontend data tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/frontend/package-lock.json
      - run: npm ci
      # These tests use only Node built-ins and our own plain JavaScript modules, but
      # installing anyway keeps that from being load-bearing.
      - run: npm test
