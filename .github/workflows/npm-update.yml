name: Update npm packages

# Installs the given frontend packages, rebuilds the lockfile and opens a pull request.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Exact versions to install, such as "vitest@5.0.3 @vitest/coverage-v8@5.0.3"
        required: true
      dev:
        description: Save them as devDependencies
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # npm 10 crashes on vitest's optional peer dependencies, which npm 11 fixes.
      - run: npm install -g npm@11.21.1

      # Inputs go through env so they're never pasted into the script.
      - name: Install the packages
        env:
          PACKAGES: ${{ inputs.packages }}
          SAVE: ${{ inputs.dev && '--save-dev' || '--save-prod' }}
        run: npm install --save-exact "$SAVE" $PACKAGES

      - name: Keep npm's logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: ~/.npm/_logs/

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ inputs.packages }}
          BRANCH: deps/npm-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "Bump $PACKAGES in the frontend"
          git push origin "$BRANCH"
          gh pr create --base develop --title "Bump $PACKAGES in the frontend" \
            --body "Opened by the Update npm packages workflow."
