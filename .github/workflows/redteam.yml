# Runs poisoned material against the real models. It spends real calls, so it doesn't run on every
# push: a few cases when AI code changes, and all of them on request.
name: Red-team evaluations

on:
  pull_request:
    paths:
      - code/backend/app/ai/**
      - code/backend/evals/**
      - .github/workflows/redteam.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redteam:
    # A fork's pull request doesn't get this repository's secrets.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: evals  # holds the keys, so each run waits for its reviewer
    defaults:
      run:
        working-directory: code/backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Run the evaluations
        # Report only on pull requests until a baseline shows how much results vary between runs.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          # Its own key, because the app's budgets don't see these calls.
          GEMINI_API_KEY: ${{ secrets.REDTEAM_GEMINI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_PROJECT: cadence-redteam
          SMOKE_FLAG: ${{ github.event_name == 'pull_request' && '--smoke' || '' }}
        run: python -m evals.redteam $SMOKE_FLAG
